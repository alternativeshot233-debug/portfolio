      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

avion.jpg\" alt=\"Aéreo · Atardecer\" style=\"width:100%;border-radius:10px;margin-bottom:14px;display:block;break-inside:avoid;\">\n            <img src=\"img/taxi.jpg\" alt=\"Taxi en movimiento\" style=\"width:100%;border-radius:10px;margin-bottom:14px;display:block;break-inside:avoid;\">\n          <\u002Fsc-if>\n          <sc-if value=\"{{ isInfancia }}\" hint-placeholder-val=\"{{ false }}\">\n            <img src=\"img/playa.jpg\" alt=\"Niña en la playa\" style=\"width:100%;border-radius:10px;margin-bottom:14px;display:block;break-inside:avoid;\">\n            <img src=\"img/familia.jpg\" alt=\"Infancia · Familia\" style=\"width:100%;border-radius:10px;margin-bottom:14px;display:block;break-inside:avoid;\">\n            <img src=\"img/hermanas.jpg\" alt=\"Infancia · Editorial\" style=\"width:100%;border-radius:10px;margin-bottom:14px;display:block;break-inside:avoid;\">\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;accent&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;Oro&quot;, &quot;Plata&quot;, &quot;Cobre&quot;], &quot;default&quot;: &quot;Oro&quot;, &quot;tsType&quot;: &quot;string&quot; },\n  &quot;parallaxIntensity&quot;: { &quot;editor&quot;: &quot;float&quot;, &quot;min&quot;: 0, &quot;max&quot;: 1.5, &quot;step&quot;: 0.1, &quot;default&quot;: 0.6, &quot;tsType&quot;: &quot;number&quot; },\n  &quot;marqueeText&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Filmmaking · Motion · Daniel Mirabal · &quot;, &quot;tsType&quot;: &quot;string&quot; }\n}\">\nclass Component extends DCLogic {\n  state = { modal: null, soundOn: true };\n\n  get IMG() { return 'img/'; }\n\n  get cols() {\n    const I = this.IMG;\n    return [\n      { key:'nocturno', title:'Nocturno', cover:I+'noche.jpg', photos:[I+'noche.jpg', I+'cines.jpg'] },\n      { key:'retrato', title:'Retrato', cover:I+'cocinero-bn.jpg', photos:[I+'cocinero-bn.jpg', I+'escaleras.jpg', I+'moda.jpg'] },\n      { key:'viajes', title:'Viajes', cover:I+'tranvia-budapest.jpg', photos:[I+'tranvia-budapest.jpg', I+'arquitectura-viena.jpg', I+'carruaje-viena.jpg', I+'avion.jpg', I+'taxi.jpg'] },\n      { key:'infancia', title:'Infancia', cover:I+'playa.jpg', photos:[I+'playa.jpg', I+'familia.jpg', I+'hermanas.jpg'] },\n    ];\n  }\n\n  renderVals() {\n    const I = this.IMG;\n    const cols = this.cols;\n    const current = cols.find(c => c.key === this.state.modal) || null;\n    const mq = (this.props.marqueeText || 'Filmmaking · Motion · Daniel Mirabal · ').repeat(6);\n    return {\n      openNocturno: () => this.setState({ modal: 'nocturno' }),\n      openRetrato: () => this.setState({ modal: 'retrato' }),\n      openViajes: () => this.setState({ modal: 'viajes' }),\n      openInfancia: () => this.setState({ modal: 'infancia' }),\n      services: [\n        { num:'01', title:'Reels & contenido social', desc:'Vídeo vertical para Instagram, TikTok y YouTube Shorts. De la idea al montaje final.' },\n        { num:'02', title:'Vídeo corporativo & marca', desc:'Piezas para negocios y profesionales que cuentan quién eres y qué ofreces.' },\n        { num:'03', title:'Retrato & editorial', desc:'Sesiones de retrato con luz, dirección y composición cuidadas al detalle.' },\n        { num:'04', title:'Viajes & documental', desc:'Reportaje de calle, viaje y eventos con mirada cinematográfica.' },\n      ],\n      marqueeRun: mq,\n      modal: current,\n      isNocturno: this.state.modal === 'nocturno',\n      isRetrato: this.state.modal === 'retrato',\n      isViajes: this.state.modal === 'viajes',\n      isInfancia: this.state.modal === 'infancia',\n      modalTitle: current ? current.title : '',\n      modalTag: current ? (current.photos.length + ' fotografías') : '',\n      closeModal: () => this.setState({ modal: null }),\n      stop: (e) => e.stopPropagation(),\n      set alue = 0;\n        o.connect(g); g.connect(filter); o.start();\n        g.gain.setValueAtTime(0, ctx.currentTime);\n        g.gain.linearRampToValueAtTime(0.11, ctx.currentTime + 5 + i);\n      });\n    });\n    // slow filter sweep for movement\n    const lfo = ctx.createOscillator(); lfo.frequency.value = 0.045;\n    const lfoG = ctx.createGain(); lfoG.gain.value = 240;\n    lfo.connect(lfoG); lfoG.connect(filter.frequency); lfo.start();\n    this.audio = { ctx, master };\n  }\n\n  setSound(on) {\n    this.buildEngine();\n    if (!this.audio) return;\n    const { ctx, master } = this.audio;\n    if (ctx.state === 'suspended') ctx.resume();\n    const t = ctx.currentTime;\n    master.gain.cancelScheduledValues(t);\n    master.gain.setValueAtTime(master.gain.value, t);\n    master.gain.linearRampToValueAtTime(on ? 0.085 : 0.0001, t + (on ? 2.6 : 1.1));\n  }\n\n  startAmbient() {\n    this.setSound(true);\n    // Browsers block audio until a user gesture — resume on first interaction.\n    const kick = () => {\n      if (this.audio && this.audio.ctx.state === 'suspended') this.audio.ctx.resume();\n      if (this.state.soundOn) this.setSound(true);\n      window.removeEventListener('pointerdown', kick);\n      window.removeEventListener('keydown', kick);\n      window.removeEventListener('scroll', kick, true);\n    };\n    window.addEventListener('pointerdown', kick);\n    window.addEventListener('keydown', kick);\n    window.addEventListener('scroll', kick, true);\n  }\n\n  componentDidMount() {\n    this.applyAccent();\n    this.swapImages();\n    // Always start at the intro, never restore scroll or jump to a #hash.\n    if ('scrollRestoration' in history) { try { history.scrollRestoration = 'manual'; } catch (e) {} }\n    if (location.hash) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }\n    const toTop = () => { window.scrollTo(0, 0); const se = document.scrollingElement; if (se) se.scrollTop = 0; };\n    toTop();\n    requestAnimationFrame(toTop);\n    setTimeout(toTop, 60);\n    this.startAmbient();\n    const hero = document.getElementById('top');\n    if (hero) {\n      this._mm = (e) => {\n        const r = hero.getBoundingClientRect();\n        const cx = (e.clientX - r.left) / r.width - 0.5;\n        const cy = (e.clientY - r.top) / r.height - 0.5;\n        const k = (this.props.parallaxIntensity != null ? this.props.parallaxIntensity : 0.6);\n        for (let i = 1; i <= 5; i++) {\n          const el = document.getElementById('collage-' + i);\n          if (!el) continue;\n          const d = parseFloat(el.dataset.depth || '1');\n          const rot = el.dataset.rot || '0';\n          el.style.transform = 'translate(' + (cx * d * 22 * k) + 'px,' + (cy * d * 22 * k) + 'px) rotate(' + rot + 'deg)';\n        }\n      };\n      window.addEventListener('mousemove', this._mm);\n    }\n    const els = this.rootEl ? this.rootEl.querySelectorAll('[data-reveal]') : [];\n    if ('IntersectionObserver' in window && els.length) {\n      els.forEach(el => { el.style.opacity = '0'; el.style.transform = 'translateY(28px)'; el.style.transition = 'opacity .8s ease, transform .8s ease'; });\n      const io = new IntersectionObserver((ents) => {\n        ents.forEach(en => { if (en.isIntersecting) { en.target.style.opacity = '1'; en.target.style.transform = 'none'; io.unobserve(en.target); } });\n      }, { threshold: 0.12 });\n      els.forEach(el => io.observe(el));\n    }\n    const cinema = document.getElementById('cinema');\n    if (cinema) {\n      const open = () => {\n        cinema.style.transform = 'scale(1)';\n        cinema.style.opacity = '1';\n        cinema.style.filter = 'none';\n        const t = document.getElementById('cinebar-top');\n        const b = document.getElementById('cinebar-bottom');\n        setTimeout(() => {\n          if (t) t.style.transform = 'translateY(-100%)';\n          if (b) b.style.transform = 'translateY(100%)';\n        }, 300);\n      };\n      if ('IntersectionObserver' in window) {\n        const cio = new IntersectionObserver((ents) => {\n          ents.forEach(en => { if (en.isIntersecting) { open(); cio.disconnect(); } });\n        }, { threshold: 0.35 });\n        cio.observe(cinema);\n        setTimeout(open, 5000);\n      } else { open(); }\n    }\n    if (window.matchMedia && window.matchMedia('(pointer:fine)').matches) {\n      const ring = document.getElementById('cursor-ring');\n      const dot = document.getElementById('cursor-dot');\n      if (ring && dot && this.rootEl) {\n        this.rootEl.classList.add('dm-nocursor');\n        let rx = window.innerWidth / 2, ry = window.innerHeight / 2, mx = rx, my = ry;\n        this._cursorMove = (e) => {\n          mx = e.clientX; my = e.clientY;\n          dot.style.transform = 'translate(-50%,-50%) translate3d(' + mx + 'px,' + my + 'px,0)';\n          ring.style.transform = 'translate(-50%,-50%) translate3d(' + mx + 'px,' + my + 'px,0)';\n          ring.style.opacity = '1'; dot.style.opacity = '1';\n          const t = e.target;\n          const inter = t && t.closest && t.closest('a,button,img,[style*=\"cursor:pointer\"]');\n          if (inter) { ring.style.width = '52px'; ring.style.height = '52px'; ring.style.background = 'rgba(200,169,110,.12)'; }\n          else { ring.style.width = '34px'; ring.style.height = '34px'; ring.style.background = 'transparent'; }\n        };\n        window.addEventListener('mousemove', this._cursorMove);\n        this._cursorLeave = () => { ring.style.opacity = '0'; dot.style.opacity = '0'; };\n        document.addEventListener('mouseleave', this._cursorLeave);\n      }\n    }\n    this._scroll = (e) => {\n      const bar = document.getElementById('progress');\n      if (!bar) return;\n      let sc = document.scrollingElement || document.documentElement;\n      const tgt = e && e.target;\n      if (tgt && tgt.nodeType === 9) sc = tgt.scrollingElement || sc;\n      else if (tgt && tgt.nodeType === 1 && tgt.scrollHeight > tgt.clientHeight + 4) sc = tgt;\n      const max = (sc.scrollHeight - sc.clientHeight) || 1;\n      bar.style.width = Math.min(100, Math.max(0, (sc.scrollTop / max) * 100)) + '%';\n    };\n    window.addEventListener('scroll', this._scroll, true);\n    this._scroll();\n  }\n\n  componentDidUpdate() { this.applyAccent(); this.swapImages(); }\n\n  componentWillUnmount() {\n    if (this._mm) window.removeEventListener('mousemove', this._mm);\n    if (this._scroll) window.removeEventListener('scroll', this._scroll, true);\n    if (this._cursorMove) window.removeEventListener('mousemove', this._cursorMove);\n    if (this._cursorLeave) document.removeEventListener('mouseleave', this._cursorLeave);\n    if (this._raf) cancelAnimationFrame(this._raf);\n    if (this.audio) { try { this.audio.ctx.close(); } catch (e) {} }\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
